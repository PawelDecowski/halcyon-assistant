name: The member corrects what the assistant knows
description: >
  The first conversation establishes vegetarian. In the second she eats fish now. Good: the old
  note is retired rather than contradicted, and the booking reflects the change without fuss.
member:
  name: Lena Fischer
  persona: >
    Lena, 38, architect, Notting Hill. Vegetarian for years. Dines with her friend Anna, who eats
    anything. Never mention fish or seafood unless your goal for this conversation says so.
conversations:
  - goal: >
      Book dinner for 2 next Tuesday at 7.30pm. Mention you're vegetarian (in this conversation it is
      still true).
    expect:
      booking: {party_size: 2, weekday: tue}
      notes_mention: [vegetarian]
  - goal: >
      You have just started eating fish. Tell the assistant, and get a seafood dinner for 2 next
      Friday around 8pm (another day is fine if Friday can't work).
    opening: "fyi I eat fish now! would love a seafood place fri 8pm for 2"
    expect:
      booking: {party_size: 2}
      notes_mention: [fish]
